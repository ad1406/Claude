<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant Mental Math Trainer</title>
<style>
:root{
  --bg:#0e1319;--panel:#161d26;--panel2:#1d2631;--line:#2a3544;--text:#e8eef5;--muted:#8d9bab;
  --accent:#5aa9ff;--accent2:#2f7fd6;--warn:#f0a53a;--bad:#ff8a6b;--good:#46c2a5;--weak:#f0a53a;--strong:#5aa9ff;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f4f6f9;--panel:#fff;--panel2:#eef2f7;--line:#d5dce6;--text:#1b2430;--muted:#5d6b7c;
    --accent:#1d6fd1;--accent2:#1458a8;--warn:#b86e00;--bad:#c4411f;--good:#0f8a6d;--weak:#d98a1c;--strong:#2a74d0}
}
:root[data-theme="light"]{--bg:#f4f6f9;--panel:#fff;--panel2:#eef2f7;--line:#d5dce6;--text:#1b2430;--muted:#5d6b7c;
  --accent:#1d6fd1;--accent2:#1458a8;--warn:#b86e00;--bad:#c4411f;--good:#0f8a6d;--weak:#d98a1c;--strong:#2a74d0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
header.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{font-weight:700;letter-spacing:.2px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:6px 12px;border-radius:8px;color:var(--muted)}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--panel2);color:var(--text);font-weight:600}
body.running header.top{display:none}
main{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
.view{display:none}.view.on{display:block}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:22px 0 8px}h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:block;width:100%}
.tile:hover{border-color:var(--accent)}
.tile .nm{font-weight:600}.tile .lv{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--strong)}
.kpi{display:flex;gap:22px;flex-wrap:wrap}
.kpi div b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi div span{color:var(--muted);font-size:13px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{color:var(--muted);font-weight:500}
details{margin:6px 0}summary{cursor:pointer;color:var(--accent)}
.lesson{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:14px}
.lesson code,.exp{font-family:ui-monospace,Consolas,monospace}
input[type=number],input[type=text],select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
label{display:inline-flex;gap:6px;align-items:center}
/* run */
#run{max-width:720px;margin:0 auto;text-align:center}
.hud{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;margin-bottom:24px;align-items:center}
.qtag{min-height:24px;margin-bottom:6px}
.problem{font-size:clamp(34px,8vw,64px);font-weight:600;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.5px;word-break:break-word;min-height:1.3em}
.psub{color:var(--muted);min-height:22px;margin-top:2px}
#ans{font-size:clamp(28px,6vw,44px);width:min(420px,90%);text-align:center;margin-top:20px;font-family:ui-monospace,Consolas,monospace;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:8px 12px;outline:none}
#ans:focus{border-color:var(--accent)}
.pace{height:6px;background:var(--line);border-radius:3px;margin:22px auto 0;width:min(420px,90%);position:relative;overflow:hidden}
.pace i{display:block;height:100%;background:var(--accent);transition:none}
.pace i.late{background:var(--warn)}
.pace b{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--text);opacity:.5}
.fb{margin-top:22px;min-height:70px;font-size:15px}
.fb .ok{color:var(--good)}.fb .no{color:var(--bad)}
.reveal{background:var(--panel);border:1px solid var(--bad);border-radius:12px;padding:14px 16px;text-align:left;margin-top:18px}
.reveal .big{font-size:26px;font-family:ui-monospace,Consolas,monospace}
.exp{white-space:pre-wrap;color:var(--muted);font-size:14px}
.overlay{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;text-align:left;margin-top:10px}
.heat{border-collapse:separate;border-spacing:2px;width:auto}
.heat td,.heat th{padding:0;border:0;width:22px;height:22px;text-align:center;font-size:10px;color:var(--muted)}
.heat td.c{border-radius:4px;color:rgba(0,0,0,.65);font-size:9px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border-radius:6px;padding:2px 7px;font-size:12px;font-family:ui-monospace,Consolas,monospace;color:rgba(0,0,0,.75)}
.legend{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px}
.warnbar{background:var(--panel2);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:12px;color:var(--warn);font-size:13px}
svg text{fill:var(--muted);font-size:10px}
@media (max-width:560px){header.top{padding:8px 10px}nav button{padding:5px 8px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">∑ Quant Mental Math</div>
  <nav id="nav">
    <button data-v="home">Home</button><button data-v="train">Train</button><button data-v="learn">Learn</button>
    <button data-v="mock">Mock test</button><button data-v="insights">Insights</button><button data-v="settings">Settings</button>
  </nav>
</header>
<main>
  <div id="storeWarn" class="warnbar" style="display:none">Browser storage is unavailable here, so progress will not persist. Use Settings → Export before closing.</div>
  <section id="v-home" class="view"></section>
  <section id="v-train" class="view"></section>
  <section id="v-learn" class="view"></section>
  <section id="v-mock" class="view"></section>
  <section id="v-insights" class="view"></section>
  <section id="v-settings" class="view"></section>
  <section id="v-run" class="view"></section>
</main>
<noscript>This tool needs JavaScript.</noscript>

<script>
(() => {
'use strict';

/* =====================================================================
   utilities
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const clean = x => parseFloat(x.toPrecision(12));
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const tens = n => Math.pow(10, n);
const rnd = d => R(tens(d - 1), tens(d) - 1);
const DAY = 864e5;
const now = () => Date.now();
const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const M = s => String(s).replace(/-/g, '−');            // pretty minus for display
const exact = (x, dp) => Math.abs(x * tens(dp) - Math.round(x * tens(dp))) < 1e-7;
const decPlaces = x => { for (let d = 0; d < 9; d++) if (exact(x, d)) return d; return 9; };
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const places = n => { const s = String(n), out = []; for (let i = 0; i < s.length; i++) { const v = +s[i] * tens(s.length - 1 - i); if (v) out.push(v); } return out; };
const digitsOf = n => String(n).replace(/[^0-9]/g, '').length;
const isPrime = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const spf = n => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return i; return n; };
const fmtSec = s => s == null ? '–' : s.toFixed(1) + 's';
const fmtClock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* =====================================================================
   problem helpers
   ===================================================================== */
function rat(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; }
// answer fields for a rational result: exact decimal if short, else 3dp with tolerance; fractions always accepted
function ratProb(r) {
  const real = r.n / r.d; let t = r.d; while (t % 2 === 0) t /= 2; while (t % 5 === 0) t /= 5;
  const p = { real, frac: true, simp: r.d === 1 ? String(r.n) : r.n + '/' + r.d };
  if (t === 1 && decPlaces(real) <= 3) p.ans = clean(real); else { p.ans = +real.toFixed(3); p.atol = 0.0006; }
  return p;
}
function digitFacts(a, b) {           // multiplication facts hidden inside a long multiplication
  const da = String(a).split('').map(Number), db = String(b).split('').map(Number), out = new Set();
  da.forEach(x => db.forEach(y => { if (x >= 2 && y >= 2) out.add(Math.min(x, y) + 'x' + Math.max(x, y)); }));
  return [...out];
}
function expAdd(a, b) { let cur = a; const steps = [a]; for (const v of places(b)) { cur += v; steps.push(cur); } return `${a} + ${b}: ` + steps.join(' → ') + `   (add ${places(b).join(', ')} in turn, left to right)`; }
function expSub(a, b) { let cur = a; const steps = [a]; for (const v of places(b)) { cur -= v; steps.push(cur); } return `${a} − ${b}: ` + steps.map(M).join(' → ') + `   (subtract ${places(b).join(', ')} in turn)`; }
function expMul(a, b) {
  const near = n => n >= 12 && [8, 9, 1, 2].includes(n % 10), len = n => String(n).length;
  let sm, big;
  if (len(a) !== len(b)) { sm = len(a) < len(b) ? a : b; } else sm = a < b ? a : b;
  big = sm === a ? b : a;
  if (sm < 10) { const ps = places(big); if (ps.length === 1) return `${a}×${b} = ${a * b}`; return `${big}×${sm} = ` + ps.map(v => `${v}×${sm}`).join(' + ') + ' = ' + ps.map(v => v * sm).join(' + ') + ` = ${a * b}`; }
  if (near(b) && !near(a)) { sm = b; big = a; } else if (near(a) && !near(b)) { sm = a; big = b; }
  if (near(sm)) { const r = Math.round(sm / 10) * 10, d = sm - r, o = d < 0 ? '−' : '+'; return `${big}×${sm} = ${big}×${r} ${o} ${big}×${Math.abs(d)} = ${big * r} ${o} ${big * Math.abs(d)} = ${a * b}`; }
  const ps = places(sm); if (ps.length === 1) return `${a}×${b} = ${a * b}`;
  return `${big}×${sm} = ` + ps.map(v => `${big}×${v}`).join(' + ') + ' = ' + ps.map(v => big * v).join(' + ') + ` = ${a * b}`;
}

/* =====================================================================
   skill definitions
   ===================================================================== */
const SKILLS = [], SK = {};
function def(o) { SKILLS.push(o); SK[o.id] = o; }
const memo = (f) => { const c = {}; return L => c[L] || (c[L] = f(L)); };

/* ---- facts (item level, spaced repetition) ---- */
const MUL_MAX = [9, 12, 15, 20];
const mulPool = memo(L => { const out = [], m = MUL_MAX[L - 1]; for (let a = 2; a <= m; a++) for (let b = a; b <= m; b++) out.push({ key: a + 'x' + b, band: MUL_MAX.findIndex(x => b <= x) + 1 }); return out; });
def({ id: 'mul', cat: 'Facts', name: 'Times tables', imp: 1, pre: [], maxL: 4, T: [1.2, 1.4, 1.7, 2.0], names: ['2–9', 'to 12', 'to 15', 'to 20'],
  desc: 'Instant recall of products. Every fact is tracked and rescheduled individually.',
  item: { pool: mulPool, make(key) { let [a, b] = key.split('x').map(Number); if (Math.random() < .5) [a, b] = [b, a]; return { text: `${a} × ${b}`, expr: `${a}*${b}`, ans: a * b, explain: a * b <= 100 && Math.max(a, b) <= 10 ? `${a} × ${b} = ${a * b}` : expMul(a, b) }; } } });
def({ id: 'divf', cat: 'Facts', name: 'Division facts', imp: .8, pre: ['mul'], maxL: 4, T: [1.4, 1.7, 2.0, 2.4], names: ['2–9', 'to 12', 'to 15', 'to 20'],
  desc: 'Times tables run backwards: 168 ÷ 12.',
  item: { pool: mulPool, make(key) { const [a, b] = key.split('x').map(Number); const d = Math.random() < .5 ? a : b, q = d === a ? b : a; return { text: `${a * b} ÷ ${d}`, expr: `${a * b}/${d}`, ans: q, explain: `${a * b} ÷ ${d} = ${q} because ${d} × ${q} = ${a * b}` }; } } });
const SQR = [[2, 20], [21, 35], [36, 50], [51, 75], [76, 99]];
const sqPool = memo(L => { const out = []; for (let n = SQR[L - 1][0]; n <= SQR[L - 1][1]; n++) out.push({ key: String(n), band: L }); const all = []; for (let l = 1; l <= L; l++) for (let n = SQR[l - 1][0]; n <= SQR[l - 1][1]; n++) all.push({ key: String(n), band: l }); return all; });
function expSq(n) {
  if (n <= 10) return `${n}² = ${n * n}`;
  if (n % 10 === 5) { const k = (n - 5) / 10; return `${n}² : ${k} × ${k + 1} = ${k * (k + 1)}, then append 25 → ${n * n}`; }
  if (n >= 45 && n <= 55) { const d = n - 50; return `${n}² = 2500 ${d < 0 ? '−' : '+'} ${100 * Math.abs(d)} + ${d * d} = ${n * n}`; }
  if (n >= 90) { const d = 100 - n; return `${n}² = 10000 − ${200 * d} + ${d * d} = ${n * n}`; }
  const m = Math.round(n / 10) * 10, d = n - m;
  return `${n}² = (${m} ${d < 0 ? '−' : '+'} ${Math.abs(d)})² = ${m * m} ${d < 0 ? '−' : '+'} ${2 * m * Math.abs(d)} + ${d * d} = ${n * n}`;
}
def({ id: 'sq', cat: 'Facts', name: 'Squares', imp: .7, pre: ['mul'], maxL: 5, T: [1.3, 2.5, 3.5, 4.5, 6], names: ['to 20', '21–35', '36–50', '51–75', '76–99'],
  desc: 'Squares up to 99, with the shortcuts that make large ones quick.',
  item: { pool: sqPool, make(key) { const n = +key; return { text: `${n}²`, html: `${n}<sup>2</sup>`, expr: `${n}*${n}`, ans: n * n, explain: expSq(n) }; } } });
const POW = (() => {
  const m = new Map(), add = (b, e, L) => { const k = b + '^' + e; if (!m.has(k)) m.set(k, { key: k, b, e, band: L }); };
  for (let e = 3; e <= 10; e++) add(2, e, 1); for (let n = 3; n <= 10; n++) add(n, 3, 1); add(3, 4, 1); add(5, 4, 1);
  for (let e = 11; e <= 16; e++) add(2, e, 2); for (let e = 5; e <= 7; e++) add(3, e, 2); for (let n = 11; n <= 15; n++) add(n, 3, 2); add(4, 4, 2); add(4, 5, 2); add(6, 4, 2); add(7, 4, 2);
  for (let e = 17; e <= 20; e++) add(2, e, 3); for (let e = 8; e <= 10; e++) add(3, e, 3); add(4, 6, 3); add(4, 7, 3); add(5, 5, 3); add(5, 6, 3); add(6, 5, 3); add(7, 5, 3); add(8, 4, 3); add(9, 4, 3); add(9, 5, 3);
  return [...m.values()];
})();
def({ id: 'pow', cat: 'Facts', name: 'Powers', imp: .4, pre: ['mul'], maxL: 3, T: [1.8, 2.8, 4], names: ['2ⁿ ≤ 1024, cubes', '2¹⁶, 3⁷, cubes ≤ 15', '2²⁰, 3¹⁰, 7⁵…'],
  desc: 'Powers of 2, cubes and other anchor values.',
  item: { pool: L => POW.filter(x => x.band <= L), make(key) { const x = POW.find(p => p.key === key); const ans = Math.pow(x.b, x.e); return { text: `${x.b}^${x.e}`, html: `${x.b}<sup>${x.e}</sup>`, expr: `${x.b}**${x.e}`, ans, explain: x.b === 2 && x.e > 10 ? `2^${x.e} = 1024 × 2^${x.e - 10} = ${ans}` : `${x.b}^${x.e} = ${Math.pow(x.b, x.e - 1)} × ${x.b} = ${ans}` }; } } });
const FD_Q = [[2, 3, 4, 5, 8, 10], [6, 9, 11, 12, 16, 20, 25], [7, 13, 14, 15, 17, 18, 19]];
const FD = (() => { const out = []; FD_Q.forEach((qs, i) => qs.forEach(q => { const ps = i === 0 ? [...Array(q - 1).keys()].map(x => x + 1) : i === 1 ? [1, 2, q - 1] : [1, 2, 3]; [...new Set(ps)].filter(p => p < q && gcd(p, q) === 1).forEach(p => out.push({ key: p + '/' + q, p, q, band: i + 1 })); })); return out; })();
def({ id: 'fd', cat: 'Facts', name: 'Fractions ↔ decimals', imp: .8, pre: ['divf'], maxL: 3, T: [1.5, 2, 3], names: ['halves…tenths', 'sixths…25ths', 'sevenths…19ths'],
  desc: 'Know 1/7 = 0.142857, 3/8 = 0.375, 5/6 = 83.3% on sight.',
  item: { pool: L => FD.filter(x => x.band <= L), make(key) {
    const x = FD.find(f => f.key === key), val = x.p / x.q; const r = Math.random();
    if (x.p === 1 && x.q >= 3 && r < .22) return { text: `1 / n ≈ ${val.toPrecision(3)}`, sub: 'find n', ans: x.q, explain: `1/${x.q} = ${val.toFixed(6)}…` };
    if (r < .62) return { text: `${x.p}/${x.q} = ?`, sub: 'decimal, 3 d.p.', ans: +val.toFixed(3), real: val, atol: .0006, explain: `${x.p}/${x.q} = ${val.toFixed(6)}…` + (x.q === 7 ? '\n(sevenths cycle 142857: 1/7=.142857, 2/7=.285714, 3/7=.428571, 4/7=.571428, 5/7=.714285, 6/7=.857142)' : '') };
    return { text: `${x.p}/${x.q} = ?`, sub: 'as a percent, 1 d.p.', ans: +(val * 100).toFixed(1), real: val * 100, atol: .06, explain: `${x.p}/${x.q} = ${(val * 100).toFixed(3)}%` };
  } } });
def({ id: 'prime', cat: 'Facts', name: 'Primes & factors', imp: .3, pre: ['mul', 'divf'], maxL: 3, T: [2.5, 4.5, 8], names: ['< 100', '< 300', '< 1000'],
  desc: 'Spot factors and primality quickly.',
  gen(L) { const [lo, hi] = [[12, 99], [100, 300], [300, 999]][L - 1]; let N; if (Math.random() < .3) { do N = R(lo, hi); while (!isPrime(N)); } else { do N = R(lo, hi); while (isPrime(N)); }
    const f = spf(N); return { text: `Smallest prime factor of ${N}`, sub: `enter ${N} itself if it is prime`, ans: f, explain: f === N ? `${N} is prime: no prime up to ${Math.floor(Math.sqrt(N))} divides it` : `${N} = ${f} × ${N / f}` }; } });

/* ---- arithmetic ---- */
def({ id: 'add', cat: 'Arithmetic', name: 'Addition', imp: 1, pre: [], maxL: 5, T: [2, 2.6, 3.5, 4.8, 7], names: ['2d+2d', '3d+2d', '3d+3d', '4d+3d', '3 × 4-digit'],
  desc: 'Multi-digit sums, left to right.',
  gen(L) { let nums; if (L === 1) nums = [rnd(2), rnd(2)]; else if (L === 2) nums = [rnd(3), rnd(2)]; else if (L === 3) nums = [rnd(3), rnd(3)]; else if (L === 4) nums = [rnd(4), rnd(3)]; else nums = [rnd(4), rnd(4), rnd(3)];
    if (L < 5 && Math.random() < .5) nums.reverse(); const ans = nums.reduce((a, b) => a + b, 0);

def({ id: 'pct', cat: 'Arithmetic', name: 'Percentages', imp: .9, pre: ['mul1', 'dec', 'fd'], maxL: 5, T: [2.5, 4, 5.5, 7, 10], names: ['10/25/50% of round', 'multiples of 5%', 'any %', 'change & increase', 'reverse & successive'],
  desc: 'Of, change, reverse and compounding.',
  gen(L) {
    let p, N, ans, text, expr, explain;

def({ id: 'frac', cat: 'Arithmetic', name: 'Fractions', imp: .9, pre: ['fd', 'mul1', 'divf'], maxL: 5, T: [4, 5.5, 6.5, 9, 12], names: ['fraction of N', '+/− friendly denominators', '× and ÷', '+/− unlike denominators', 'compound & mixed'],

  } });
def({ id: 'est', cat: 'Arithmetic', name: 'Estimation', imp: .5, pre: ['mul1'], maxL: 4, T: [5, 7, 9, 11], names: ['2d×2d ±5%', '3d×2d ±4%', '4d×3d or ÷2d ±3%', '± 2%'],

def({ id: 'word', cat: 'Arithmetic', name: 'Averages, rates & ratios', imp: .6, pre: ['pct', 'div'], maxL: 4, T: [5, 7, 10, 13], names: ['mean of a list', 'proportion & rate', 'weighted & updated mean', 'work rates & mixtures'],

function seqGen(L) {

  const types = {
    arith() { const a = R(1, 50), d = R(2, 13) * (Math.random() < .2 ? -1 : 1); return mk(Array.from({ length: 7 }, (_, i) => a + i * d), `add ${d} each time`); },
    geom() { const a = R(1, 5), r = pick([2, 3]); return mk(Array.from({ length: 6 }, (_, i) => a * Math.pow(r, i)), `× ${r} each time`); },
    quad() { const a = R(1, 20), d0 = R(1, 6), k = R(1, 4); const t = [a]; let d = d0; for (let i = 0; i < 6; i++) { t.push(t[t.length - 1] + d); d += k; } return mk(t, `differences grow by ${k} (${d0}, ${d0 + k}, ${d0 + 2 * k}…)`); },
    sqoff() { const s = R(2, 9), c = R(-5, 12); return mk(Array.from({ length: 6 }, (_, i) => (s + i) * (s + i) + c), `n² ${c < 0 ? '−' : '+'} ${Math.abs(c)} for n = ${s}, ${s + 1}, …`); },
    lin() { const a = R(1, 6), m = pick([2, 3]), c = R(-3, 5); const t = [a]; for (let i = 0; i < 5; i++) t.push(t[t.length - 1] * m + c); return mk(t, `× ${m} ${c < 0 ? '−' : '+'} ${Math.abs(c)} each step`); },

    prime() { const ps = []; for (let n = 2; ps.length < 11; n++) if (isPrime(n)) ps.push(n); const s = R(0, 4); return mk(ps.slice(s, s + 6), 'consecutive primes'); },

}

function targetSec(id, level, ans) { return SK[id].T[level - 1] * (PROFILE[S.settings.profile] || 1) + 0.35 + 0.22 * digitsOf(ans); }

function weakness(id) {
  const s = sk(id), w = s.win.filter(e => !e.retry);
  if (!w.length) return { wk: .5, n: 0, acc: null, spd: null };
  let sw = 0, sa = 0, ss = 0, sc = 0;
  w.forEach((e, i) => { const wt = Math.pow(.93, w.length - 1 - i); sw += wt; sa += wt * (e.ok ? 1 : 0); if (e.ok && e.r != null) { ss += wt * Math.min(3, e.r); sc += wt; } });
  const acc = sa / sw, spd = sc ? ss / sc : 1.5;
  const raw = .55 * clamp((1 - acc) / .25, 0, 1) + .45 * clamp(spd - 1, 0, 1), n = w.length;
  return { wk: (raw * n + .5 * 3) / (n + 3), n, acc, spd };
}
const DEPS = {}; SKILLS.forEach(d => d.pre.forEach(p => (DEPS[p] = DEPS[p] || []).push(d.id)));
function priority(id, sess) {
  const d = SK[id], { wk } = weakness(id), s = sk(id);
  let boost = 0; (DEPS[id] || []).forEach(x => { const w = weakness(x); if (w.n >= 4) boost += .5 * Math.max(0, w.wk - .25); });
  const maint = s.last ? Math.min(.25, .04 * (now() - s.last) / DAY) : 0;
  return d.imp * (.08 + wk + maint) * (1 + boost) / (1 + .4 * ((sess && sess[id]) || 0));
}

  }).join('')}</table><div class="muted small" style="margin-top:6px">Pace is average time ÷ target time for correct answers (1.0× = on test pace). Fluency scores combine accuracy and pace.</div>` : '<p class="muted">Do a placement or a few sessions and this fills in.</p>'}</div>
  <div class="grid2">
  <div class="card"><h3>Questions per day</h3>${spark(qs, { min: 0 })}<div class="muted small">last ${days.length} days with practice</div></div>
  <div class="card"><h3>Accuracy % per day</h3>${spark(accs, { min: 50, max: 100 })}</div>
  <div class="card"><h3>Pace (× target, lower is faster)</h3>${spark(spd, { min: .5, max: 3, ref: 1, refLabel: 'target' })}</div>
  <div class="card"><h3>Fluency index</h3>${spark(idxs, { min: 0, max: 100 })}</div></div>
  <div class="card"><h3>Fact map</h3><div class="row"><select id="itemSel">${['mul', 'divf', 'sq', 'pow', 'fd'].map(id => `<option value="${id}" ${id === sel ? 'selected' : ''}>${esc(SK[id].name)}</option>`).join('')}</select></div>
  <div class="legend"><span>weak / slow</span><i style="background:${mix2(0)}"></i><i style="background:${mix2(.25)}"></i><i style="background:${mix2(.5)}"></i><i style="background:${mix2(.75)}"></i><i style="background:${mix2(1)}"></i><span>automatic</span><i style="background:transparent;border:1px dashed var(--muted)"></i><span>not seen yet</span></div>
  ${factMap(sel)}</div>
  ${errTot >= 5 ? `<div class="card"><h3>Error types (all time)</h3><table>${Object.entries(errAll).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(ERR_NAME[k])}</td><td>${Math.round(100 * v / errTot)}%</td><td class="small muted">${esc(ERR_MSG[k])}</td></tr>`).join('')}</table></div>` : ''}
  ${S.mocks.length ? `<div class="card"><h3>Mock test scores</h3>${spark(S.mocks.filter(m => m.id === 'ref').map(m => m.correct), { min: 0, max: 80 })}<div class="muted small">Numeracy sprint · reference, correct answers per attempt</div></div>` : ''}`;
  const itemSel = $('#itemSel'); if (itemSel) itemSel.onchange = () => { window.__itemSkill = itemSel.value; renderInsights(); };
}
function factMap(id) {
  const cell = (key, label) => { const it = S.items[itemKey(id, key)], m = itemMastery(it); const tip = it ? `${label}: ${it.cor}/${it.att} correct, ${it.eT != null ? it.eT.toFixed(2) + '× target' : 'n/a'}, box ${it.box}` : `${label}: not seen`; return { m, tip }; };
  if (id === 'mul' || id === 'divf') {
    const N = 20; let h = '<table class="heat"><tr><th></th>' + Array.from({ length: N - 1 }, (_, i) => `<th>${i + 2}</th>`).join('') + '</tr>';
    for (let a = 2; a <= N; a++) { h += `<tr><th>${a}</th>`; for (let b = 2; b <= N; b++) { const k = Math.min(a, b) + 'x' + Math.max(a, b), c = cell(k, `${a}×${b}`); h += `<td class="c" title="${esc(c.tip)}" style="background:${c.m == null ? 'transparent;outline:1px dashed var(--line);outline-offset:-1px' : mix2(c.m)}"></td>`; } h += '</tr>'; } return h + '</table>';
  }
  const pool = SK[id].item.pool(SK[id].maxL); return '<div class="chips">' + pool.map(e => { const c = cell(e.key, fmtKey(id, e.key)); return `<span class="chip" title="${esc(c.tip)}" style="background:${c.m == null ? 'transparent;border:1px dashed var(--line);color:var(--muted)' : mix2(c.m)}">${esc(fmtKey(id, e.key))}</span>`; }).join('') + '</div>';
}
function renderSettings() {
  const st = S.settings;
  $('#v-settings').innerHTML = `<h1>Settings</h1><div class="card">
  <div class="row" style="margin-bottom:10px"><label>Pace profile <select id="stProfile"><option value="standard">Standard (test pace)</option><option value="fast">Fast (80% of test time)</option><option value="elite">Elite (65%)</option></select></label></div>
  <div class="row" style="margin-bottom:10px"><label><input type="checkbox" id="stAuto"> Auto-advance when the typed answer is exactly right</label></div>
  <div class="row" style="margin-bottom:10px"><label><input type="checkbox" id="stPace"> Show the pace bar during drills</label></div>
  <div class="row" style="margin-bottom:10px"><label>Default session (min) <input type="number" id="stMin" min="3" max="60" style="width:70px"></label><label>Daily goal (min) <input type="number" id="stGoal" min="3" max="120" style="width:70px"></label><label>Theme <select id="stTheme"><option value="auto">Auto</option><option value="dark">Dark</option><option value="light">Light</option></select></label></div></div>
  <div class="card"><h3>Your data</h3><p class="muted small">Everything is stored in this browser only. Export a backup before clearing browser data or switching browsers.</p><div class="row"><button class="btn" id="btnExport">Export JSON</button><label class="btn">Import JSON<input type="file" id="fileImport" accept="application/json" style="display:none"></label><button class="btn danger" id="btnReset">Reset everything</button></div></div>`;
  $('#stProfile').value = st.profile; $('#stAuto').checked = st.auto; $('#stPace').checked = st.pace; $('#stMin').value = st.sessMin; $('#stGoal').value = st.goal; $('#stTheme').value = st.theme;
  $('#stProfile').onchange = e => { st.profile = e.target.value; save(); };
  $('#stAuto').onchange = e => { st.auto = e.target.checked; save(); };
  $('#stPace').onchange = e => { st.pace = e.target.checked; save(); };
  $('#stMin').onchange = e => { st.sessMin = clamp(+e.target.value || 10, 3, 60); save(); };
  $('#stGoal').onchange = e => { st.goal = clamp(+e.target.value || 15, 3, 120); save(); };
  $('#stTheme').onchange = e => { st.theme = e.target.value; applyTheme(); save(); };
  $('#btnExport').onclick = () => { flush(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = 'mental-math-progress-' + dayKey() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
  $('#fileImport').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const o = JSON.parse(t); if (!o || typeof o !== 'object' || !o.skills) throw 0; if (!confirm('Replace current progress with this file?')) return; const d = defaultState(); S = Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}) }); flush(); applyTheme(); showView('home'); } catch (x) { alert('That file does not look like exported progress.'); } }); };
  $('#btnReset').onclick = () => { if (confirm('Delete all progress? This cannot be undone.') && confirm('Really delete everything?')) { S = defaultState(); flush(); applyTheme(); showView('home'); } };
}
function applyTheme() { const t = S.settings.theme; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

/* =====================================================================
   wiring
   ===================================================================== */
document.addEventListener('click', e => {
  const nb = e.target.closest('#nav button'); if (nb) { if (!Run) showView(nb.dataset.v); return; }
  const a = e.target.closest('[data-act]'); if (!a || Run) return; e.preventDefault();
  const [act, arg] = a.dataset.act.split(':');
  if (act === 'go') showView(arg);
  else if (act === 'smart') startRun({ mode: 'smart', min: +arg });
  else if (act === 'weak') startRun({ mode: 'smart', min: +arg, only: 'weak' });
  else if (act === 'facts') startRun({ mode: 'smart', min: +arg, only: 'facts' });
  else if (act === 'skill') startRun({ mode: 'skill', skill: arg, min: 5 });
  else if (act === 'skillSel') startRun({ mode: 'skill', skill: $('#skSel').value, min: +$('#skMin').value });
  else if (act === 'place') startRun({ mode: 'placement', skills: CORE_PLACE });
  else if (act === 'placeSel') { const ids = $$('#plChips input:checked').map(x => x.value); if (ids.length) startRun({ mode: 'placement', skills: ids, restart: $('#plRestart').checked }); }
  else if (act === 'mock') { const m = MOCKS.find(x => x.id === arg); startRun({ mode: 'mock', mock: m, n: m.n, min: m.min }); }
  else if (act === 'mockCustom') { const n = clamp(+$('#cmN').value || 80, 5, 200), mi = clamp(+$('#cmM').value || 8, 1, 60); startRun({ mode: 'mock', mock: { id: 'custom', name: `Custom ${n}/${mi}`, mix: MOCKS[0].mix }, n, min: mi }); }
});

function selfTest() {
  const fails = []; const bad = (m) => { if (fails.length < 40) fails.push(m); };
  SKILLS.forEach(d => {
    for (let L = 1; L <= d.maxL; L++) {
      const probs = [];
      if (d.item) d.item.pool(L).forEach(e => probs.push(d.item.make(e.key, L))); else for (let i = 0; i < 250; i++) probs.push(d.gen(L));
      probs.forEach(p => {
        const tag = `${d.id} L${L} "${p.text}"`;
        if (typeof p.ans !== 'number' || !isFinite(p.ans)) return bad(tag + ' bad ans');
        if (!p.text || !p.explain) return bad(tag + ' missing text/explain');
        const real = p.real !== undefined ? p.real : p.ans;
        if (p.expr) { let v; try { v = Function('"use strict";return (' + p.expr + ')')(); } catch (x) { return bad(tag + ' expr error ' + p.expr); } if (Math.abs(v - real) > 1e-9 * Math.max(1, Math.abs(real))) bad(`${tag} expr=${p.expr} gives ${v}, ans ${real}`); }
        const c = checkAns(p, String(p.ans)); if (!c.ok && !p.rtol) bad(tag + ' own answer rejected');
        if (!p.rtol && !c.auto) bad(tag + ' own answer not auto-accepted');
        if (p.rtol && !checkAns(p, String(Math.round(real))).ok) bad(tag + ' rounded real rejected');
        if (p.frac && p.simp && !checkAns(p, p.simp).ok) bad(tag + ' simp fraction rejected');
        const t = targetSec(d.id, L, p.ans); if (!(t > 0)) bad(tag + ' target');
      });
    }
  });
  return fails;
}
window.MM = { cur: () => Run && Run.p, run: () => Run, SKILLS, SK, S: () => S, sk, weakness, priority, makeProblem, checkAns, afterAnswer, updItem, classify, selfTest, diagnose, buildMock, startRun, pickSkill, fluencyIndex, mulPool, setState: x => { S = x; } };

applyTheme();
if (!storeOK) $('#storeWarn').style.display = '';
showView('home');
})();
