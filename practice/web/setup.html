<!doctype html><html><head><meta charset="utf-8"><title>Music Practice · setup check</title>
<style>body{font:14px system-ui,sans-serif;margin:40px;max-width:760px;color:#1d1d1f;background:#f6f5f2}h1{font-size:20px}
.row{display:flex;gap:10px;padding:6px 10px;border-radius:6px;background:#fff;margin:4px 0;border:1px solid #e3e1dc}.ok{color:#15803d}.bad{color:#b91c1c}
.d{color:#6b6b70;font-size:12px;margin-left:auto;max-width:60%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head>
<body><h1>Music Practice · setup check</h1><p id="s">Checking…</p><div id="list"></div>
<script>
async function tick(){const r=await (await fetch('/api/doctor')).json();const L=document.getElementById('list');L.innerHTML='';
for(const [k,v] of Object.entries(r.checks)){const d=document.createElement('div');d.className='row';d.innerHTML=`<b class="${v.ok?'ok':'bad'}">${v.ok?'✓':'✗'}</b><span>${k}</span><span class="d" title="${(v.detail||'').replace(/"/g,'')}">${v.detail||''}</span>`;L.appendChild(d)}
const bad=Object.values(r.checks).filter(v=>!v.ok).length;document.getElementById('s').textContent=r.done?(bad?`${bad} problem(s). Claude can read the details from app\\logs\\doctor.json.`:'Everything works. You can close this window.'):'Checking… (the OMR model download can take a minute)';
if(!r.done)setTimeout(tick,1000)}tick();
</script></body></html>
